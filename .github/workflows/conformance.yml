name: Conformance

# Cross-language parity gate (and, in the compare job, the check that the
# handbook tables generated from the code are current): each language driver round-trips the shared
# fixture through the IO contract and emits a normalised CSV; compare.py
# asserts the outputs are value-equal within 1e-9 (see conformance/README.md).
#
# Stata: no `stata-conformance` job yet — blocked on a STATA_LIC secret or a
# self-hosted Stata runner (issue #133). compare.py tolerates the missing
# output, so the job slots in without touching the compare step.

# Not run for the rendered handbook (docs/, which is all the handbook bot's
# pull requests touch) or for certificates alone. Source handbook changes
# (book/) still run it: the compare job checks the generated tables and the
# version stamps, which live there. No check is required by branch
# protection, so a skipped run blocks nothing.
on:
  push:
    branches: [main, develop]
    paths-ignore: ['docs/**', '.parity/**']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['docs/**', '.parity/**']

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-conformance:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: ./r
          extra-packages: any::devtools

      - name: Run R driver
        run: Rscript conformance/run_r.R conformance/fixtures/indicators.csv out_r.csv

      - uses: actions/upload-artifact@v4
        with:
          name: out_r
          path: out_r.csv

  python-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install ./python

      - name: Run Python driver
        run: python conformance/run_python.py conformance/fixtures/indicators.csv out_python.csv

      - uses: actions/upload-artifact@v4
        with:
          name: out_python
          path: out_python.csv

  compare:
    runs-on: ubuntu-latest
    needs: [r-conformance, python-conformance]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compare driver outputs
        run: >
          python conformance/compare.py
          r=out_r.csv python=out_python.csv stata=out_stata.csv

      # The handbook's coverage, API-key, auditor-rule and parity-case tables
      # are generated from the code (book/_scripts/gen_tables.py). Fails when
      # an export has no row, a note contradicts the code, or the committed
      # tables in book/_generated/ are stale. Standard library only: seconds.
      - name: Handbook tables match the code
        run: python3 book/_scripts/gen_tables.py --check

      # Every version stamp (r/DESCRIPTION, dw_io.R/.py, pyproject, CITATION,
      # Zenodo, README, NEWS, the handbook's as-of lines, the tests that pin
      # it) names the same release and date. Standard library only.
      - name: Version stamps agree
        run: python3 tools/check_versions.py

      # Parity case files are well formed and no retired case id is reused
      # (conformance/retired_ids.txt). Runs no language.
      - name: Parity cases are well formed
        run: python3 conformance/certify.py --lint
