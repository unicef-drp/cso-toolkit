# ---------------------------------------------------------------------------
# ci-hygiene.yml -- Tier 0 repository hygiene (every CSO repo)
# ---------------------------------------------------------------------------
# Template from unicef-drp/cso-toolkit: templates/workflows/ci-hygiene.yml
# Guidance: docs/ci_cd_guidelines.md. Copy to .github/workflows/, with
# templates/tools/check.R copied to tools/check.R.
#
# LOCAL FIRST. The checks live in tools/check.R; run them before you push:
#   Rscript --no-init-file tools/check.R
# (or let the pre-push hook in templates/hooks/ run it). This workflow runs
# the SAME script, so local and CI cannot drift apart:
#   1. tracked-data   no data, secrets or embargoed outputs tracked
#   2. large-files    no tracked file over MAX_FILE_MB
#   3. secret-scan    gitleaks over the full history (findings redacted)
#   4. sidecars       every tracked *.provenance.json parses and has the
#                     core keys; hashes are verified locally in reviewer mode
# Configure the checks (DATA_DIRS, OUTPUT_DIRS, ALLOW_PATHS, MAX_FILE_MB) at
# the top of tools/check.R, not here.
#
# OPT-IN BY DEFAULT: runs only when started by hand (Actions tab, "Run
# workflow") and on pull requests into main (the release PR), so routine
# pushes cost no Actions minutes. To run on every push and pull request,
# replace the `on:` block with the commented one below. Only then can the job
# be a required status check (a required check that does not run on a
# branch's pull requests blocks them forever).
# ---------------------------------------------------------------------------
name: hygiene

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
# Opt in to every push and pull request (costs Actions minutes):
# on:
#   workflow_dispatch:
#   push:
#     branches: [main, develop]
#   pull_request:
#     branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    # One job, not four: each job is billed by the started minute.
    name: "hygiene (tools/check.R)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned release of the gitleaks binary (the gitleaks GitHub Action
      # needs a licence key for organisation repos; the binary does not).
      GITLEAKS_VERSION: "8.21.2"
      # Packages come from the runner's library below, not a restored renv.
      CHECK_NO_RENV: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the secret scan reads every commit, not only the tip

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install jsonlite
        shell: Rscript {0}
        run: install.packages("jsonlite")

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # CI=true is set by Actions: tools/check.R then fails, rather than
      # skips, when gitleaks is missing.
      - name: tools/check.R (hygiene checks)
        run: Rscript --no-init-file tools/check.R --only tracked-data,large-files,secret-scan,sidecars
